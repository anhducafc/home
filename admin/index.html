<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Viết bài — anhducafc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6F0;--paper:#FFFDF9;--ink:#1F1B16;--ink2:#5B534A;--ink3:#8C8379;--line:#E8DFD3;--accent:#B4532A;--soft:#F3E3D6;--ok:#3E8E5E;
  --serif:'Lora',Georgia,serif;--sans:'Be Vietnam Pro',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#9a4522}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:#B03A2E}
.btn:disabled{opacity:.5;cursor:default}
.logo{font:700 20px var(--serif)}.logo i{color:var(--accent);font-style:normal}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:14px}
.login h1{font:700 26px var(--serif)}
.login p{color:var(--ink2);font-size:14px}
.login input{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}
.login input:focus{border-color:var(--accent)}
.err{color:#B03A2E;font-size:14px;min-height:1em}

/* Layout */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:60px;padding:0 20px;background:rgba(250,246,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .stats{display:flex;gap:18px;margin-left:12px;font-size:13px;color:var(--ink3)}
.top .stats b{color:var(--ink);font-size:15px;margin-right:3px}
.top .sp{flex:1}
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2);background:var(--paper)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.plist{display:flex;flex-direction:column;gap:2px}
.pitem{text-align:left;padding:10px 12px;border-radius:10px;display:block;width:100%}
.pitem:hover{background:var(--soft)}
.pitem.on{background:var(--paper);box-shadow:0 0 0 1px var(--line) inset}
.pitem b{display:block;font:600 14.5px/1.35 var(--serif);margin-bottom:3px}
.pitem small{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.badge.draft{background:#EFE7DC;color:var(--ink2)}
.badge.pub{background:#E2F0E7;color:var(--ok)}
.badge.star{background:var(--soft);color:var(--accent)}

/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;padding:28px 32px 120px;max-width:1180px;width:100%;margin:0 auto}
.cover{position:relative;aspect-ratio:16/6;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--ink3);cursor:pointer;overflow:hidden;background:var(--paper);transition:.15s}
.cover:hover,.cover.drag{border-color:var(--accent);color:var(--accent)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ca{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.cover .ca .btn{padding:6px 12px;font-size:13px;background:rgba(255,253,249,.95)}
.cover.has{border-style:solid}
.catpick{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
.catpick button{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink2);background:var(--paper)}
.catpick button.on{color:#fff}
#title{width:100%;border:0;outline:0;background:transparent;resize:none;font:700 clamp(28px,3.4vw,40px)/1.2 var(--serif);letter-spacing:-.4px;overflow:hidden;margin-bottom:6px}
#title::placeholder{color:#CFC5B9}
.tb{position:sticky;top:60px;z-index:20;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:6px;margin:10px 0 18px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(31,27,22,.04)}
.tb button{min-width:34px;height:34px;padding:0 8px;border-radius:8px;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tb button:hover{background:var(--soft);color:var(--ink)}
.tb button.on{background:var(--ink);color:#fff}
.tb .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#body{min-height:50vh;outline:0;font-size:18px;line-height:1.8}
#body:empty::before,#body.ph::before{content:attr(data-ph);color:#CFC5B9;position:absolute;pointer-events:none}
#body{position:relative}
#body p{margin:0 0 1em}
#body h2{font:600 26px/1.3 var(--serif);margin:1.3em 0 .5em}
#body h3{font:600 21px/1.35 var(--serif);margin:1.2em 0 .4em}
#body ul,#body ol{margin:0 0 1em 1.4em}
#body blockquote{border-left:3px solid var(--accent);padding-left:18px;font:italic 500 20px/1.55 var(--serif);color:var(--ink2);margin:1.2em 0}
#body a{color:var(--accent)}
#body img{max-width:100%;border-radius:12px;display:block;margin:.4em 0}
#body img.sel{outline:3px solid var(--accent)}
#body figure{margin:1em 0}
#body hr{border:0;border-top:1px solid var(--line);margin:2em 0}
#body .uploading{opacity:.4}
.panel{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:10px}
.card label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}
.card label:first-of-type{margin-top:0}
.card input[type=date],.card input[type=text],.card textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:0;font-size:14px}
.card textarea{resize:vertical;min-height:80px}
.card input:focus,.card textarea:focus{border-color:var(--accent)}
.card .hint{font-size:12px;color:var(--ink3);margin-top:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin-top:12px;cursor:pointer}
.switch input{appearance:none;width:40px;height:22px;border-radius:999px;background:#DDD3C6;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.state{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .row{display:flex;gap:8px}.acts .row .btn{flex:1}
.foot{position:fixed;left:300px;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:16px;padding:10px 24px;background:rgba(255,253,249,.96);border-top:1px solid var(--line);font-size:13px;color:var(--ink3)}
.foot .sp{flex:1}
.welcome{max-width:560px;margin:12vh auto;text-align:center;padding:0 24px}
.welcome h2{font:700 30px var(--serif);margin-bottom:10px}
.welcome p{color:var(--ink2);margin-bottom:22px}

/* Preview */
.modal{position:fixed;inset:0;background:rgba(31,27,22,.5);z-index:60;overflow:auto;padding:4vh 16px}
.modal .sheet{max-width:780px;margin:0 auto;background:var(--bg);border-radius:18px;padding:40px 44px 56px;position:relative}
.modal .x{position:absolute;right:16px;top:14px}
.pv h1{font:700 38px/1.2 var(--serif);margin:8px 0 18px}
.pv .cv{aspect-ratio:16/8;border-radius:12px;overflow:hidden;margin:20px 0 28px;background:var(--soft)}
.pv .cv img{width:100%;height:100%;object-fit:cover}
.pv .bd{font-size:18px;line-height:1.8}
.pv .bd p{margin:0 0 1.1em}.pv .bd h2{font:600 26px var(--serif);margin:1.3em 0 .5em}.pv .bd h3{font:600 21px var(--serif);margin:1.2em 0 .4em}
.pv .bd ul,.pv .bd ol{margin:0 0 1em 1.4em}.pv .bd blockquote{border-left:3px solid var(--accent);padding-left:18px;font:italic 500 20px var(--serif);color:var(--ink2);margin:1.2em 0}
.pv .bd img{max-width:100%;border-radius:12px}.pv .bd a{color:var(--accent)}
.pv .meta{font-size:13px;color:var(--ink3)}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;transition:.25s;z-index:80;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:#F0B08E;font-weight:600}
.confetti{position:fixed;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
.back{display:none}

@media(max-width:1100px){.ed{grid-template-columns:1fr}.panel{position:static}.top .stats{display:none}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0}
  .app.editing .side{display:none}
  .app:not(.editing) main{display:none}
  .foot{left:0;padding:10px 14px}
  .ed{padding:18px 16px 120px}
  .back{display:inline-flex}
  .top{padding:0 12px;gap:8px}
  .top .hide-m{display:none}
}
</style>
</head>
<body>

<!-- Đăng nhập / tạo mật khẩu -->
<div class="login" id="loginView" hidden>
  <form id="loginForm">
    <div class="logo">anhducafc<i>.</i></div>
    <h1 id="lgTitle">Đăng nhập để viết bài</h1>
    <p id="lgDesc"></p>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" required>
    <input type="password" id="pw2" placeholder="Nhập lại mật khẩu" autocomplete="new-password" hidden>
    <div class="err" id="lgErr"></div>
    <button class="btn pri" id="lgBtn">Đăng nhập</button>
  </form>
</div>

<!-- Ứng dụng -->
<div id="appView" hidden>
  <header class="top">
    <button class="btn back" id="backBtn">← Bài viết</button>
    <a class="logo hide-m" href="/" target="_blank" title="Mở trang chủ">anhducafc<i>.</i></a>
    <div class="stats" id="stats"></div>
    <div class="sp"></div>
    <a class="btn hide-m" href="/" target="_blank">Xem trang ↗</a>
    <button class="btn hide-m" id="pwBtn">Đổi mật khẩu</button>
    <button class="btn" id="logoutBtn">Đăng xuất</button>
  </header>
  <div class="app" id="app">
    <aside class="side">
      <button class="btn dark" id="newBtn">✏️ Viết bài mới</button>
      <input type="search" id="find" placeholder="Tìm bài…">
      <div class="chips" id="filters">
        <button data-f="all" class="on">Tất cả</button><button data-f="published">Đã đăng</button><button data-f="draft">Bản nháp</button>
      </div>
      <div class="plist" id="plist"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="../config.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmt = s => s ? s.split("-").reverse().join("/") : "";
const catOf = k => CATS[k] || { name: k || "—", color: "#999" };
const CAT_KEYS = Object.keys(CATS);

let CSRF = "", POSTS = [], cur = null, dirty = false, filter = "all", saving = false;

/* ---------- API ---------- */
async function api(action, body, isForm) {
  const opt = { method: body ? "POST" : "GET", headers: { "X-CSRF": CSRF }, credentials: "same-origin" };
  if (body) { if (isForm) opt.body = body; else { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); } }
  let r, txt, j;
  try { r = await fetch("api.php?action=" + action, opt); txt = await r.text(); }
  catch { throw new Error("Không kết nối được máy chủ."); }
  try { j = JSON.parse(txt.replace(/^\uFEFF/, "")); }
  catch {
    const raw = txt.trim().slice(0, 400);
    const why = raw.startsWith("<?php") ? "Máy chủ không chạy PHP mà trả về nguyên mã nguồn."
      : /parse error|syntax error|fatal error/i.test(raw) ? "PHP báo lỗi (có thể phiên bản PHP quá cũ)."
      : "Máy chủ trả về dữ liệu lạ (mã " + r.status + ").";
    const e = new Error(why); e.raw = raw; throw e;
  }
  if (r.status === 401 && action !== "login") { showLogin(false); }
  if (!r.ok) throw new Error(j.error || "Có lỗi xảy ra.");
  return j;
}

/* ---------- Đăng nhập ---------- */
let setupMode = false;
function showLogin(setup) {
  setupMode = setup;
  $("#appView").hidden = true; $("#loginView").hidden = false;
  $("#lgTitle").textContent = setup ? "Chào Tommy! Tạo mật khẩu" : "Đăng nhập để viết bài";
  $("#lgDesc").textContent = setup ? "Lần đầu dùng trang quản trị. Đặt mật khẩu (ít nhất 8 ký tự) — chỉ bạn biết mật khẩu này." : "";
  $("#pw2").hidden = !setup; $("#pw2").required = setup;
  $("#pw").autocomplete = setup ? "new-password" : "current-password";
  $("#lgBtn").textContent = setup ? "Tạo mật khẩu & bắt đầu" : "Đăng nhập";
  $("#pw").focus();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#lgErr").textContent = "";
  if (setupMode && $("#pw").value !== $("#pw2").value) { $("#lgErr").textContent = "Hai mật khẩu chưa khớp."; return; }
  $("#lgBtn").disabled = true;
  try { const j = await api(setupMode ? "setup" : "login", { password: $("#pw").value }); CSRF = j.csrf; $("#pw").value = $("#pw2").value = ""; await startApp(); }
  catch (er) { $("#lgErr").textContent = er.message; }
  $("#lgBtn").disabled = false;
};
$("#logoutBtn").onclick = async () => { if (dirty && !confirm("Bài đang sửa chưa lưu. Vẫn đăng xuất?")) return; dirty = false; await api("logout", {}).catch(() => {}); location.reload(); };
$("#pwBtn").onclick = async () => {
  const old = prompt("Mật khẩu hiện tại:"); if (!old) return;
  const nw = prompt("Mật khẩu mới (ít nhất 8 ký tự):"); if (!nw) return;
  try { await api("password", { old, new: nw }); toast("Đã đổi mật khẩu."); } catch (er) { toast(er.message); }
};

async function startApp() {
  const j = await api("list");
  POSTS = j.posts || [];
  $("#loginView").hidden = true; $("#appView").hidden = false;
  renderList(); renderStats(); welcome();
}

/* ---------- Danh sách & thống kê ---------- */
function renderStats() {
  const pub = POSTS.filter(p => p.status === "published");
  const month = today().slice(0, 7);
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const weekOf = s => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
  const weeks = new Set(pub.map(p => weekOf(p.date)));
  let streak = 0, w = new Date(weekOf(today()) + "T00:00:00");
  if (!weeks.has(ymd(w))) w.setDate(w.getDate() - 7);   // tuần này chưa viết thì tính từ tuần trước
  while (weeks.has(ymd(w))) { streak++; w.setDate(w.getDate() - 7); }
  $("#stats").innerHTML = `<span><b>${pub.length}</b>bài đã đăng</span><span><b>${pub.filter(p => p.date.startsWith(month)).length}</b>bài tháng này</span>` +
    `<span><b>${streak}</b>tuần liên tiếp có bài ${streak >= 2 ? "🔥" : ""}</span><span><b>${POSTS.length - pub.length}</b>bản nháp</span>`;
}
function renderList() {
  const q = $("#find").value.trim().toLowerCase();
  const list = POSTS.filter(p => (filter === "all" || p.status === filter) && (!q || (p.title || "").toLowerCase().includes(q)))
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.updated || "").localeCompare(a.updated || ""));
  $("#plist").innerHTML = list.length ? list.map(p => `<button class="pitem ${cur && cur.id === p.id ? "on" : ""}" data-id="${p.id}">
    <b>${esc(p.title || "(Chưa có tiêu đề)")}</b><small><span class="dot" style="background:${catOf(p.cat).color}"></span>${esc(catOf(p.cat).name)} · ${fmt(p.date)}
    ${p.status === "published" ? `<span class="badge pub">Đã đăng</span>` : `<span class="badge draft">Nháp</span>`}${p.featured ? `<span class="badge star">★</span>` : ""}</small></button>`).join("")
    : `<p style="color:var(--ink3);font-size:14px;padding:12px">Không có bài nào.</p>`;
}
$("#find").oninput = renderList;
$("#filters").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b)); renderList(); };
$("#plist").onclick = e => { const b = e.target.closest("[data-id]"); if (b) openPost(POSTS.find(p => p.id === b.dataset.id)); };
$("#newBtn").onclick = () => openPost(null);
$("#backBtn").onclick = () => { if (dirty && !confirm("Bài chưa lưu. Vẫn quay lại? (Bản nháp vẫn được giữ trên máy này.)")) return; dirty = false; cur = null; $("#app").classList.remove("editing"); renderList(); welcome(); };

function welcome() {
  const hasDraft = POSTS.some(p => p.status === "draft");
  $("#main").innerHTML = `<div class="welcome"><div style="font-size:46px">✍️</div><h2>Hôm nay viết gì nhỉ?</h2>
    <p>Chọn một bài bên trái để sửa, hoặc bắt đầu một bài mới.${hasDraft ? " Bạn còn vài bản nháp đang chờ đó." : ""}</p>
    <button class="btn pri" onclick="openPost(null)">Viết bài mới</button></div>`;
}

/* ---------- Mở bài ---------- */
function blank() { return { id: "", title: "", cat: CAT_KEYS[0], date: today(), status: "draft", featured: false, image: "", excerpt: "", quote: "", slug: "", body: "" }; }
function openPost(p) {
  if (dirty && !confirm("Bài đang sửa chưa lưu. Chuyển bài khác? (Bản nháp vẫn được giữ trên máy này.)")) return;
  cur = p ? JSON.parse(JSON.stringify(p)) : blank();
  dirty = false;
  $("#app").classList.add("editing");
  renderEditor(); renderList();
  const local = loadLocal();
  if (local && local.savedAt > Date.parse(cur.updated || 0) && JSON.stringify(stripMeta(local.post)) !== JSON.stringify(stripMeta(cur))) {
    toast(`Có bản đang viết dở trên máy này (${new Date(local.savedAt).toLocaleString("vi-VN")}).`, "Khôi phục", () => { cur = local.post; renderEditor(); markDirty(); }, 9000);
  }
  scrollTo({ top: 0 });
}
const stripMeta = p => ({ t: p.title, b: p.body, e: p.excerpt, c: p.cat, i: p.image, q: p.quote });

function renderEditor() {
  const p = cur;
  $("#main").innerHTML = `<div class="ed"><div>
    <div class="cover ${p.image ? "has" : ""}" id="cover" title="Bấm hoặc kéo ảnh vào đây">
      ${p.image ? `<img src="${esc(p.image)}" alt=""><div class="ca"><button class="btn" data-cv="change">Đổi ảnh</button><button class="btn" data-cv="remove">Bỏ ảnh</button></div>`

/* ---------- Trình soạn thảo ---------- */
let savedRange = null;
function bindEditor() {
  const T = $("#title"), B = $("#body");
  const grow = () => { T.style.height = "auto"; T.style.height = T.scrollHeight + "px"; };
  grow();
  T.oninput = () => { grow(); cur.title = T.value; markDirty(); };
  T.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); B.focus(); } };
  try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch {}
  const ensureP = () => { if (!B.innerHTML.trim() || B.innerHTML === "<br>") { B.innerHTML = "<p><br></p>"; const r = document.createRange(); r.setStart(B.firstChild, 0); r.collapse(true); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } };
  B.addEventListener("focus", ensureP); B.addEventListener("keydown", ensureP, true);
  B.oninput = () => { cur.body = B.innerHTML; markDirty(); updateWC(); phState(); };
  const phState = () => B.classList.toggle("ph", !B.innerText.trim() && !B.querySelector("img,hr,li"));
  phState();
  B.onkeyup = B.onmouseup = () => { saveRange(); updateTB(); };
  B.addEventListener("keydown", onBodyKey);
  B.addEventListener("paste", onPaste);
  B.addEventListener("click", e => { B.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel")); if (e.target.tagName === "IMG") e.target.classList.add("sel"); });
  ["dragover", "dragenter"].forEach(ev => B.addEventListener(ev, e => { if (hasFiles(e)) e.preventDefault(); }));
  B.addEventListener("drop", e => {
    if (!hasFiles(e)) return; e.preventDefault();
    const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if (r) savedRange = r;
    [...e.dataTransfer.files].filter(f => f.type.startsWith("image/")).forEach(insertImageFile);
  });
  $("#tb").onmousedown = e => e.preventDefault();   // giữ vùng chọn
  $("#tb").onclick = e => { const b = e.target.closest("[data-cmd]"); if (b) runCmd(b.dataset.cmd); };
  $("#catpick").onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; cur.cat = b.dataset.cat; markDirty(); syncFromForm(); renderEditor(); };
  $("#date").onchange = e => { cur.date = e.target.value; markDirty(); };
  $("#featured").onchange = e => { cur.featured = e.target.checked; $("#quoteWrap").hidden = !cur.featured; markDirty(); };
  $("#quote").oninput = e => { cur.quote = e.target.value; markDirty(); };
  $("#excerpt").oninput = e => { cur.excerpt = e.target.value; markDirty(); };
  $("#slug").oninput = e => { cur.slug = e.target.value; $("#slugShow").textContent = e.target.value || "…"; markDirty(); };
  const cv = $("#cover");
  cv.onclick = e => { const a = e.target.closest("[data-cv]"); if (a && a.dataset.cv === "remove") { e.stopPropagation(); cur.image = ""; markDirty(); syncFromForm(); renderEditor(); return; } pickFile(f => uploadCover(f)); };
  ["dragover", "dragenter"].forEach(ev => cv.addEventListener(ev, e => { e.preventDefault(); cv.classList.add("drag"); }));
  cv.addEventListener("dragleave", () => cv.classList.remove("drag"));
  cv.addEventListener("drop", e => { e.preventDefault(); cv.classList.remove("drag"); const f = [...e.dataTransfer.files].find(f => f.type.startsWith("image/")); if (f) uploadCover(f); });
  document.querySelector(".panel").onclick = e => { const b = e.target.closest("[data-act]"); if (b) doAct(b.dataset.act); };
  updateWC(); updateSaveState();
  if (!cur.id && !cur.title) T.focus();
}
function syncFromForm() { const B = $("#body"); if (B) cur.body = B.innerHTML; }
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
function saveRange() { const s = getSelection(); if (s.rangeCount && $("#body").contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); }
function restoreRange() { const B = $("#body"); B.focus(); if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } }
function currentBlock() {
  const s = getSelection(); if (!s.rangeCount) return null;
  let n = s.anchorNode; const B = $("#body");
  while (n && n !== B) { if (n.nodeType === 1 && /^(P|H2|H3|BLOCKQUOTE|LI|DIV)$/.test(n.tagName)) return n; n = n.parentNode; }
  return null;
}
function updateTB() {
  const blk = currentBlock(), tag = blk ? blk.tagName.toLowerCase() : "";
  document.querySelectorAll("#tb [data-cmd]").forEach(b => {
    const c = b.dataset.cmd; let on = false;
    if (["bold", "italic", "underline", "strikeThrough", "insertUnorderedList", "insertOrderedList"].includes(c)) { try { on = document.queryCommandState(c); } catch {} }
    if (c === "h2" || c === "h3" || c === "blockquote") on = tag === c || (c === "blockquote" && blk && blk.closest("blockquote"));
    b.classList.toggle("on", !!on);
  });
}
function runCmd(c) {
  restoreRange();
  const blk = currentBlock();
  if (c === "p" || c === "h2" || c === "h3") document.execCommand("formatBlock", false, blk && blk.tagName.toLowerCase() === c && c !== "p" ? "<p>" : `<${c}>`);
  else if (c === "blockquote") document.execCommand("formatBlock", false, blk && blk.closest("blockquote") ? "<p>" : "<blockquote>");
  else if (c === "link") {
    const sel = getSelection().toString();
    let url = prompt(sel ? `Gắn link cho “${sel.slice(0, 40)}”:` : "Dán đường link:", "https://");
    if (!url || url === "https://") return;
    if (!/^(https?:|mailto:|\/|#)/i.test(url)) url = "https://" + url;
    if (sel) document.execCommand("createLink", false, url);
    else document.execCommand("insertHTML", false, `<a href="${esc(url)}">${esc(url)}</a>&nbsp;`);
  }
  else if (c === "image") { saveRange(); pickFile(insertImageFile); return; }
  else if (c === "hr") document.execCommand("insertHTML", false, "<hr><p><br></p>");
  else document.execCommand(c, false, null);
  cur.body = $("#body").innerHTML; markDirty(); updateTB(); saveRange();
}
function onBodyKey(e) {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); saveRange(); runCmd("link"); return; }
  if ((e.key === "Backspace" || e.key === "Delete")) { const img = $("#body img.sel"); if (img) { e.preventDefault(); (img.closest("figure") || img).remove(); cur.body = $("#body").innerHTML; markDirty(); return; } }
  if (e.key === " ") {   // phím tắt kiểu markdown
    const blk = currentBlock(); if (!blk || blk.tagName === "LI") return;
    const t = blk.textContent, map = { "##": "h2", "###": "h3", ">": "blockquote", "-": "ul", "*": "ul", "1.": "ol" };
    const m = map[t.trim()];
    if (m && getSelection().anchorOffset === t.length) {
      e.preventDefault(); blk.textContent = ""; blk.innerHTML = "<br>";
      const r = document.createRange(); r.setStart(blk, 0); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      if (m === "ul") document.execCommand("insertUnorderedList"); else if (m === "ol") document.execCommand("insertOrderedList"); else document.execCommand("formatBlock", false, `<${m}>`);
      cur.body = $("#body").innerHTML; markDirty(); updateTB();
    }
  }
}

/* Dán nội dung: giữ định dạng cơ bản, bỏ màu/font rác từ Word, Google Docs, web */
const OK_TAGS = { P: 1, H2: 1, H3: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, BR: 1, HR: 1, UL: 1, OL: 1, LI: 1, BLOCKQUOTE: 1, A: 1, IMG: 1, FIGURE: 1, FIGCAPTION: 1 };
function cleanNode(root) {
  [...root.childNodes].forEach(n => {
    if (n.nodeType === 8) { n.remove(); return; }
    if (n.nodeType !== 1) return;
    if (/^(SCRIPT|STYLE|META|LINK|TITLE|IFRAME|OBJECT|SVG|FORM|INPUT|BUTTON|NOSCRIPT|TEMPLATE)$/.test(n.tagName)) { n.remove(); return; }
    cleanNode(n);
    let tag = n.tagName;
    if (tag === "H1") tag = "H2"; if (/^H[4-6]$/.test(tag)) tag = "H3"; if (tag === "DIV") tag = "P";
    if (!OK_TAGS[tag]) { n.replaceWith(...n.childNodes); return; }
    const el = document.createElement(tag);
    if (tag === "A" && n.getAttribute("href") && /^(https?:|mailto:|\/|#)/i.test(n.getAttribute("href"))) el.setAttribute("href", n.getAttribute("href"));
    if (tag === "IMG") { const src = n.getAttribute("src") || ""; if (!/^(https?:|\/)/i.test(src)) { n.remove(); return; } el.setAttribute("src", src); el.setAttribute("alt", n.getAttribute("alt") || ""); }
    el.append(...n.childNodes); n.replaceWith(el);
  });
}
function onPaste(e) {
  const cd = e.clipboardData; if (!cd) return;
  const imgs = [...cd.files].filter(f => f.type.startsWith("image/"));
  if (imgs.length) { e.preventDefault(); saveRange(); imgs.forEach(insertImageFile); return; }
  e.preventDefault();
  const html = cd.getData("text/html");
  if (html) {
    const d = new DOMParser().parseFromString(html, "text/html"); cleanNode(d.body);
    document.execCommand("insertHTML", false, d.body.innerHTML);
  } else {
    const txt = cd.getData("text/plain");
    const paras = txt.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
    document.execCommand("insertHTML", false, txt.includes("\n") ? paras : esc(txt));
  }
}

/* ---------- Ảnh ---------- */
function pickFile(cb) { const f = $("#filePick"); f.value = ""; f.onchange = () => f.files[0] && cb(f.files[0]); f.click(); }
async function shrink(file) {   // thu nhỏ ảnh trên máy trước khi tải lên: nhanh hơn, nhẹ hosting
  if (!/image\/(jpeg|png|webp)/.test(file.type)) return file;
  const bmp = await createImageBitmap(file).catch(() => null); if (!bmp) return file;
  const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  if (k === 1 && file.size < 900 * 1024) return file;
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
  return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
}
async function upload(file) {
  const fd = new FormData(); fd.append("file", await shrink(file));
  return (await api("upload", fd, true)).url;
}
async function uploadCover(file) {
  syncFromForm();
  const cv = $("#cover"); cv.innerHTML = `<div>Đang tải ảnh lên…</div>`;
  try { cur.image = await upload(file); markDirty(); } catch (er) { toast(er.message); }
  renderEditor();
}
async function insertImageFile(file) {
  restoreRange();
  const tmp = "up" + Math.random().toString(36).slice(2);
  document.execCommand("insertHTML", false, `<figure><img id="${tmp}" class="uploading" src="${URL.createObjectURL(file)}" alt=""></figure><p><br></p>`);
  try {
    const url = await upload(file);
    const img = document.getElementById(tmp);
    if (img) { img.src = url; img.removeAttribute("id"); img.classList.remove("uploading"); if (!img.className) img.removeAttribute("class"); }
  } catch (er) { const img = document.getElementById(tmp); if (img) (img.closest("figure") || img).remove(); toast(er.message); }
  cur.body = $("#body").innerHTML; markDirty();
}

/* ---------- Lưu ---------- */
let localTimer;
function markDirty() {
  dirty = true; updateSaveState();
  clearTimeout(localTimer);
  localTimer = setTimeout(() => { try { localStorage.setItem(localKey(), JSON.stringify({ savedAt: Date.now(), post: cur })); } catch {} updateSaveState(); }, 800);
}
const localKey = () => "adc.draft." + (cur.id || "new");
function loadLocal() { try { return JSON.parse(localStorage.getItem(localKey()) || "null"); } catch { return null; } }
function clearLocal(id) { try { localStorage.removeItem("adc.draft." + (id || "new")); localStorage.removeItem("adc.draft.new"); } catch {} }
function updateSaveState() {
  const el = $("#saveState"); if (!el) return;
  el.textContent = dirty ? "Chưa lưu lên trang · đã giữ tạm trên máy này" : (cur.updated ? "Đã lưu lúc " + new Date(cur.updated).toLocaleString("vi-VN") : "");
}
function updateWC() {
  const t = ($("#body").innerText || "").trim(), n = t ? t.split(/\s+/).length : 0;
  $("#wc").textContent = `${n} chữ · khoảng ${Math.max(1, Math.round(n / 200))} phút đọc`;
}
async function save(status) {
  if (saving) return; syncFromForm();
  if (!cur.title.trim()) { toast("Bài viết cần có tiêu đề nhé."); $("#title").focus(); return; }
  if ($("#body .uploading")) { toast("Đợi ảnh tải lên xong đã."); return; }
  saving = true;
  const wasPub = cur.status === "published";
  try {
    const oldId = cur.id;
    const j = await api("save", { post: { ...cur, status } });
    if (j.post.featured) POSTS.forEach(p => p.featured = false);
    const i = POSTS.findIndex(p => p.id === j.post.id);
    if (i >= 0) POSTS[i] = j.post; else POSTS.unshift(j.post);
    clearLocal(oldId); clearLocal(j.post.id);
    cur = JSON.parse(JSON.stringify(j.post)); dirty = false;
    renderEditor(); renderList(); renderStats();
    if (status === "published" && !wasPub) { confetti(); toast("🎉 Đã đăng! Bài đã lên trang chủ.", "Xem bài", () => open("/#/p/" + cur.slug, "_blank"), 6000); }
    else toast(status === "published" ? "Đã cập nhật bài." : wasPub ? "Đã gỡ xuống, bài thành bản nháp." : "Đã lưu nháp.");
  } catch (er) { toast(er.message); }
  saving = false;
}
async function doAct(a) {
  if (a === "publish") return save("published");
  if (a === "draft") return save("draft");
  if (a === "unpublish") { if (confirm("Gỡ bài khỏi trang chủ và chuyển thành nháp?")) save("draft"); return; }
  if (a === "preview") return preview();
  if (a === "delete") {
    if (!confirm(`Xoá hẳn bài “${cur.title}”? Không thể hoàn tác.`)) return;
    try { await api("delete", { id: cur.id }); POSTS = POSTS.filter(p => p.id !== cur.id); clearLocal(cur.id); dirty = false; cur = null; renderList(); renderStats(); welcome(); $("#app").classList.remove("editing"); toast("Đã xoá bài."); }
    catch (er) { toast(er.message); }
  }
}
function preview() {
  syncFromForm();
  const m = document.createElement("div"); m.className = "modal";
  const c = catOf(cur.cat);
  m.innerHTML = `<div class="sheet pv"><button class="btn x">Đóng ✕</button>
    <span style="color:${c.color};font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">${esc(c.name)}</span>
    <h1>${esc(cur.title || "(Chưa có tiêu đề)")}</h1><div class="meta">${esc(SITE.author)} · ${fmt(cur.date)}</div>
    ${cur.image ? `<div class="cv"><img src="${esc(cur.image)}" alt=""></div>` : `<div style="height:24px"></div>`}<div class="bd">${cur.body}</div></div>`;
  m.onclick = e => { if (e.target === m || e.target.closest(".x")) m.remove(); };
  m.querySelectorAll("script").forEach(s => s.remove());
  document.body.appendChild(m);
}
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && cur) { e.preventDefault(); save(cur.status === "published" ? "published" : "draft"); }
  if (e.key === "Escape") document.querySelector(".modal")?.remove();
});
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Tiện ích ---------- */
let toastT;
function toast(msg, btn, fn, ms = 3200) {
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${btn ? `<button>${esc(btn)}</button>` : ""}`;
  if (btn) t.querySelector("button").onclick = () => { t.classList.remove("show"); fn(); };
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}
function confetti() {
  const cols = Object.values(CATS).map(c => c.color).concat(["#F0B08E", "#E0A458"]);
  for (let i = 0; i < 90; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.background = cols[i % cols.length]; d.style.left = innerWidth / 2 + "px"; d.style.top = innerHeight * .6 + "px";
    document.body.appendChild(d);
    const a = Math.random() * Math.PI * 2, v = 180 + Math.random() * 320;
    d.animate([{ transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v - 260}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(${Math.cos(a) * v * 1.2}px,${Math.sin(a) * v + 200}px) rotate(${Math.random() * 1080}deg)`, opacity: 0 }],
      { duration: 1600 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => d.remove();
  }
}

/* ---------- Khởi động ---------- */
(async () => {
  try {
    const s = await api("status"); CSRF = s.csrf;
    if (s.setup) showLogin(true); else if (!s.loggedIn) showLogin(false); else await startApp();
  } catch (er) {
    document.body.innerHTML = `<div class="welcome" style="max-width:720px"><h2>Chưa chạy được trang quản trị</h2><p>${esc(er.message)}</p>
      ${er.raw ? `<p style="font-size:14px">Máy chủ trả về (chụp màn hình phần này gửi Claude):</p><pre style="text-align:left;white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;max-height:40vh;overflow:auto">${esc(er.raw)}</pre>` : ""}
      <p style="font-size:14px">Trang này cần hosting có PHP 7.0 trở lên (cPanel → Select PHP Version).</p></div>`;
  }
})();
</script>
</body>
</html>
